name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: '$JAVA_MAJOR'"
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect Java major version." >&2
            exit 1
          fi
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Detected version: $JAVA_MAJOR" >&2
            exit 1
          fi
          
          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing file."
          else
            echo "./debug.keystore does not exist. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be verified after generation step." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify_apk
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "WARNING: Expected APK at $EXPECTED_APK was not found."
            echo "Searching only inside app/build/outputs/apk directory..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            if [ -d "android/app/build/outputs/apk" ]; then
              echo "Checking android/app/build/outputs/apk directory..."
              find android/app/build/outputs/apk -type f -name "*.apk"
            fi
            echo "ERROR: Expected debug APK ($EXPECTED_APK) does not exist." >&2
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Discovered APK file is empty: $EXPECTED_APK" >&2
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK" >&2; exit 1 ;;
          esac
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null)
          echo "Verified APK: $EXPECTED_APK ($APK_SIZE bytes)"
          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TEMP_ASSET_DIR="${{ runner.temp }}/apk_release_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          # Sanitize repository name to safe characters
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="tradelab-options"
          fi
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/--*/-/g')
          
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"
          
          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Release asset could not be prepared at $TARGET_PATH" >&2
            exit 1
          fi
          
          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared release asset is missing or empty." >&2
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_SHA="${{ github.sha }}"
          
          RELEASE_NOTES="### TradeLab Debug APK Build #${{ github.run_number }}
          - **Build Type**: Automatically generated debug APK
          - **Build System**: GitHub Actions (${{ runner.os }})
          - **GitHub Actions Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: \`${TARGET_SHA}\`
          - **Intended Use**: Testing and development verification
          - **Signing**: Signed with temporary debug keystore (not intended for production or Play Store release)

          Download the \`${{ steps.prepare_asset.outputs.asset_filename }}\` file below directly to test on your Android device."
          
          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" \
            "$RELEASE_ASSET" \
            --title "$TITLE" \
            --target "$TARGET_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest
            
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "SUCCESS: GitHub Release published successfully!"
            gh release view "$TAG"
            
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}")
            
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK can be downloaded directly from the **Assets** section of the release page above." >> "$GITHUB_STEP_SUMMARY"
            echo "The Actions artifact \`app-debug-apk\` is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation encountered an error or was skipped."
            echo "APK build and artifact packaging succeeded!"
            echo "The debug APK Actions artifact 'app-debug-apk' remains fully available for download."
            
            echo "### ⚠️ Debug APK Build Succeeded (Release Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build Result**: Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact**: The verified \`app-debug-apk\` artifact is available for download in this workflow run's Summary section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Note**: GitHub Release publishing encountered an issue, but the built APK was preserved safely." >> "$GITHUB_STEP_SUMMARY"
          fi
